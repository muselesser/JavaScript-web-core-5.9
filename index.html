<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>  
        my first website
    </title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
<div class="container">
    <div class="left">
        <img src=".vscode/images/logo.svg" alt="logo" class="logo">
        <img src=".vscode/images/bg.jpg" alt="background" class="background">
</div>

<div class="right"> 
   <div class="idk">
    <h2>Get iintoo it today</h2>
    <p>Theres no charge or obligation upon registration.</p>
   </div>

   <div class="registration">
    
    <button class="facebook">
        <img src=".vscode/images/facebook.svg">
        <span class="icon">Register with Facebook</span> 
    </button>

    <button class="linkedin">
        <img src=".vscode/images/linkedin.svg">
        <span class="icon">Register with LinkedIn</span> 
    </button>
   </div>
    

    <div class="or">
     <span>OR</span>
    </div>
   
    
   <div class="input-fields">

    <div class='box'>
     <input type="email" placeholder="">
     <label>Email</label>
    </div>

    <div class="box">
     <input type="tel" placeholder="">
     <label>Phone</label>
    </div>
   </div>
   
   <div class="account">
      <h2>What type of investor are you?</h2>
      <p>Select the type of investor you are below</p>
      
      <div class="options">
    <label class="option">
        <input type="radio" name="account" checked>
        <span>Individual</span>
        <div class="info">
            i
            <div class="tooltip">
                I am a natural person investing on my
                own behalf as a sole owner, joint tenant,
                or tenant in common.
            </div>
        </div>
    </label>

    <label class="option">
        <input type="radio" name="account">
        <span>Business</span>
        <div class="info">
            i
            <div class="tooltip">Account information.</div>
        </div>
    </label>

    <label class="option">
        <input type="radio" name="account">
        <span>IRA</span>
        <div class="info">
            i
            <div class="tooltip">Account information.</div>
        </div>
    </label>

    <label class="option">
        <input type="radio" name="account">
        <span>Trust</span>
        <div class="info">
            i
            <div class="tooltip">Account information.</div>
        </div>
    </label>

</div>
    
    </div>

   <div class="submit">
    <input type="checkbox" name="terms"> I agree to the Terms and receiving notifications from iintoo.<a href="https://youtu.be/dQw4w9WgXcQ?si=-jkTt_8GrcMVLXki" target="_blank">View full terms</a>
    <br>
    <button>Create Account</button>
   </div>
</div>
</body>
</html>
